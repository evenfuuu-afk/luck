:root{color-scheme:light dark;

:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:linear-gradient(170deg,var(--bg2),var(--bg) 55%);background-attachment:fixed;color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
main{max-width:560px;margin:0 auto;padding:clamp(24px,5vw,56px) 16px 48px}
.maker a,.foot a{color:inherit;text-underline-offset:3px}.maker{display:inline-block;margin:0 0 12px;padding:5px 16px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);font-size:14px;font-weight:500;background:var(--paper)}
h1{margin:0 0 4px;font-size:clamp(30px,7vw,42px);line-height:1.1;font-weight:900;color:var(--accent);text-wrap:balance}
.sub{margin:0 0 24px;color:var(--soft)}
.cal{position:relative;perspective:1400px}
.rings{display:flex;justify-content:space-around;padding:0 18%;position:relative;z-index:2;margin-bottom:-12px}

.back{transform:rotateY(180deg);justify-content:center}
.top{width:100%;display:flex;justify-content:space-between;color:var(--soft);font-size:15px;border-bottom:2px dashed var(--line);padding-bottom:12px}
.day{font-size:clamp(110px,30vw,160px);font-weight:900;line-height:1;margin:24px 0 4px;color:var(--accent);font-variant-numeric:tabular-nums}
.wk{font-size:22px;font-weight:900}
.hint{margin-top:auto;color:var(--soft);font-size:15px}
.tag{display:inline-block;padding:4px 14px;border-radius:999px;font-size:14px;font-weight:500;color:#fff;margin-bottom:18px}

.no{color:var(--soft);font-size:14px}
.btns{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}

#copy{background:var(--paper);color:var(--accent);border:1px solid var(--accent)}

.msg{min-height:24px;margin:10px 0 0;color:var(--soft);font-size:15px}

.login button{width:100%;margin-top:14px;background:var(--gold);color:#3b2f18;box-shadow:0 6px 0 #9c7a2e}
.err{color:#b4483a;font-size:14px;min-height:20px;margin:8px 0 0;text-align:start}

.link{background:none;border:0;min-height:44px;padding:0 4px;color:var(--accent);font-size:15px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.foot{margin-top:18px;color:var(--soft);font-size:13px;text-align:center}
.maker a,.foot a{color:inherit;text-underline-offset:3px}
@media(prefers-reduced-motion:reduce){.page{transition:none}}
</style>
</head>

const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=key(now);
$('ym').textContent=now.getFullYear()+' 年 '+(now.getMonth()+1)+' 月';
$('d').textContent=now.getDate();
$('wk').textContent=WK[now.getDay()];
$('total').textContent=ALL.length;

const NK='daily-quote-name';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let name='',SK='',hist={};
const save=()=>lsSet(SK,JSON.stringify(hist));
function enter(n){
  name=n;lsSet(NK,n);
  SK='daily-quote-v1:'+n;
  try{hist=JSON.parse(lsGet(SK)||'{}')||{}}catch(e){hist={}}
  const old=lsGet('daily-quote-v1');
  if(old&&!lsGet(SK)){try{hist=JSON.parse(old)||{}}catch(e){}save();lsSet('daily-quote-v1',null)}
  $('hi').textContent=n+'，今天也要閃閃發亮 ✦';
  $('page').classList.remove('flip');
  $('draw').disabled=false;$('draw').textContent='抽今天的小籤';
  $('copy').hidden=true;$('msg').textContent='';
  $('login').hidden=true;$('app').hidden=false;
  if(hist[today]!=null&&ALL[hist[today]])show(hist[today],false);
  renderHist();
}
$('login').addEventListener('submit',e=>{
  e.preventDefault();
  const n=$('nm').value.trim();
  if(!n){$('err').textContent='請先輸入你的名字喔';$('nm').focus();return}
  $('err').textContent='';enter(n);
});
$('switch').addEventListener('click',()=>{
  lsSet(NK,null);$('nm').value='';
  $('app').hidden=true;$('login').hidden=false;$('nm').focus();
});

function show(i,anim){
  const it=ALL[i];
  $('tag').textContent=CATS[it.c];$('tag').className='tag t'+it.c;
  $('q').textContent=it.t;
  $('no').textContent='第 '+(i+1)+' 號籤 · '+today;
  if(anim){requestAnimationFrame(()=>$('page').classList.add('flip'))}else{$('page').classList.add('flip')}
  $('draw').disabled=true;$('draw').textContent='今天已抽過，明天再來';
  $('copy').hidden=false;
  tick();
}
function tick(){
  const t=new Date(),m=new Date(t);m.setHours(24,0,0,0);
  const s=Math.max(0,Math.floor((m-t)/1000));
  const h=Math.floor(s/3600),mi=Math.floor(s%3600/60);
  $('msg').textContent='距離下一次抽籤還有 '+h+' 小時 '+mi+' 分';
  if(key(t)!==today)location.reload();
}
function renderHist(){
  const ks=Object.keys(hist).sort().reverse().slice(0,14);
  $('hist').innerHTML=ks.length?ks.map(k=>{const it=ALL[hist[k]];return it?'<li><b>'+k.slice(5).replace('-','/')+'</b><span>'+it.t+'</span></li>':''}).join('')
    :'<li class="empty">還沒有紀錄，抽下第一支籤吧！</li>';
}
$('draw').addEventListener('click',()=>{
  if(hist[today]!=null)return;
  const used=new Set(Object.values(hist));
  let pool=ALL.map((_,i)=>i).filter(i=>!used.has(i));
  if(!pool.length)pool=ALL.map((_,i)=>i);
  const i=pool[Math.floor(Math.random()*pool.length)];
  hist[today]=i;save();show(i,true);renderHist();
});
$('copy').addEventListener('click',async()=>{
  const it=ALL[hist[today]];
  const txt=name+' 今天抽到的小籤\n【'+CATS[it.c]+'】'+it.t+'\n— 好運能量籤 '+today;
  try{await navigator.clipboard.writeText(txt);$('msg').textContent='已複製，可以貼給朋友了！'}
  catch(e){$('msg').textContent='無法自動複製，請長按文字手動複製'}
  setTimeout(tick,2500);
});
{
  const saved=lsGet(NK);
  if(saved)enter(saved);else $('login').hidden=false;
}
setInterval(()=>{if(hist[today]!=null)tick()},30000);
}
</script>
</body>
</html>
